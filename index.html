// Helper: translate surface & environment from module-level data
function trSurface(val, t) {
  const map = {
    Hard: t.hard,
    Clay: t.clay,
    Grass: t.grass
  };
  return map[val] || val;
}
function trEnv(val, t) {
  const map = {
    Indoor: t.indoor,
    Outdoor: t.outdoor
  };
  return map[val] || val;
}
function trMonthDate(val, t) {
  const months = {
    Jan: t.jan,
    Feb: t.feb,
    Mar: t.mar,
    Apr: t.apr,
    May: t.may,
    Jun: t.jun,
    Jul: t.jul,
    Aug: t.aug,
    Sep: t.sep,
    Oct: t.oct,
    Nov: t.nov,
    Dec: t.dec
  };
  return val.replace(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\b/g, m => months[m] || m);
}
function trEventType(val, t) {
  const map = {
    "Social Meetup": t.socialMeetupEvent,
    "Tennis Clinic": t.tennisClinc,
    "Player Mixer": t.playerMixer,
    "Workshop": t.workshop,
    "Charity Event": t.charityEventType
  };
  return map[val] || val;
}
