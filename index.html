// ── Avatar Component ──
function Avatar({ src, name, size = 32, border = true, borderColor = "#fff" }) {
  const initials = name ? name.split(" ").map(w => w[0]).join("").toUpperCase().slice(0, 2) : "?";
  return (
    <div style={{
      width: size, height: size, borderRadius: size / 2, overflow: "hidden", flexShrink: 0,
      border: border ? `2px solid ${borderColor}` : "none",
      background: "#E8F5E9",
    }}>
      {src ? (
        <img src={src} alt={name || ""} style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />
      ) : (
        <div style={{ width: "100%", height: "100%", display: "flex", alignItems: "center", justifyContent: "center", background: "#4CAF50", color: "#fff", fontSize: size * 0.38, fontWeight: 700 }}>
          {initials}
        </div>
      )}
    </div>
  );
}

// ── AvatarStack: overlapping row of faces + "+N more" ──
function AvatarStack({ people, max = 4, size = 26, theme, label }) {
  const shown = people.slice(0, max);
  const extra = people.length - max;
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 0 }}>
      <div style={{ display: "flex", marginRight: 6 }}>
        {shown.map((p, i) => (
          <div key={i} style={{ marginLeft: i === 0 ? 0 : -8, zIndex: max - i, position: "relative" }}>
            <Avatar src={p.avatar} name={p.name} size={size} borderColor={theme?.cardBg || "#fff"} />
          </div>
        ))}
        {extra > 0 && (
          <div style={{
            marginLeft: -8, zIndex: 0, width: size, height: size, borderRadius: size / 2,
            background: theme?.surfaceAlt || "#E8F5E9", border: `2px solid ${theme?.cardBg || "#fff"}`,
            display: "flex", alignItems: "center", justifyContent: "center",
            fontSize: size * 0.36, fontWeight: 700, color: theme?.textSecondary || "#666",
          }}>
            +{extra}
          </div>
        )}
      </div>
      {label && <span style={{ fontSize: 10, color: theme?.textSecondary || "#888", fontWeight: 500 }}>{label}</span>}
    </div>
  );
}

// ── People lookup helper ──
function getPersonAvatar(key) {
  return AVATARS[key] || null;
}

function TennisAce() {
  const [themeKey, setThemeKey] = useState("tennisAce");
  const [screen, setScreen] = useState("home");
  window.__setScreen = setScreen;
  const [showThemePicker, setShowThemePicker] = useState(false);
  const [screenHistory, setScreenHistory] = useState([]);
  const [navContext, setNavContext] = useState({});
  const [userPlan, setUserPlan] = useState("free"); // "free" | "premium" | "pro" | "club"
  const [lang, setLang] = useState("en");
  const [showLangPicker, setShowLangPicker] = useState(false);
  const t = T[lang] || T.en;
  const theme = THEMES[themeKey];

  const navigate = (target, ctx) => {
    setScreenHistory(prev => [...prev, screen]);
    setScreen(target);
    if (ctx) setNavContext(ctx);
  };

  // Gate premium features — free users get sent to pricing comparison
  const gatedNavigate = (target, requiredPlan, ctx) => {
    const planLevel = { free: 0, premium: 1, pro: 2, club: 3 };
    if (planLevel[userPlan] < planLevel[requiredPlan]) {
      navigate("pricingComparison");
    } else {
      navigate(target, ctx);
    }
  };

  const goBack = () => {
    if (screenHistory.length > 0) {
      const prev = screenHistory[screenHistory.length - 1];
      setScreenHistory(h => h.slice(0, -1));
      setScreen(prev);
    } else {
      setScreen("home");
    }
  };

  const screens = {
    home: <HomeScreen theme={theme} navigate={navigate} userPlan={userPlan} gatedNavigate={gatedNavigate} t={t} />,
    roleSelect: <RoleSelectScreen theme={theme} navigate={navigate} t={t} />,
    playerAssessment: <AssessmentScreen theme={theme} navigate={navigate} type="player" t={t} />,
    coachAssessment: <AssessmentScreen theme={theme} navigate={navigate} type="coach" t={t} />,
    coachSetup: <CoachSetupScreen theme={theme} navigate={navigate} t={t} />,
    courtOwnerReg: <CourtOwnerRegScreen theme={theme} navigate={navigate} t={t} />,

    coachScoreResult: <CoachScoreResultScreen theme={theme} navigate={navigate} t={t} />,

    orgScoreResult: <OrgScoreResultScreen theme={theme} navigate={navigate} t={t} />,
    clubAssessment: <ClubAssessmentScreen theme={theme} navigate={navigate} t={t} />,

    bookPayment: <BookPaymentScreen theme={theme} navigate={navigate} navContext={navContext} t={t} />,
    bookConfirm: <BookConfirmScreen theme={theme} navigate={navigate} navContext={navContext} t={t} />,

    chat: <ChatScreen theme={theme} navigate={navigate} t={t} />,

    classDetail: <ClassDetailScreen theme={theme} navigate={navigate} navContext={navContext} t={t} />,
    createClass: <CreateClassScreen theme={theme} navigate={navigate} t={t} />,

// ── ROLE SELECTION SCREEN (UPGRADED with dynamic progress) ──
function RoleSelectScreen({ theme, navigate }) {
  const [selectedRole, setSelectedRole] = useState(null);
  const [step, setStep] = useState(0);

  const roles = [
    { id: "player", icon: "user", title: "Player", desc: "Find matches, book courts, track stats & improve your game" },
    { id: "coach", icon: "award", title: "Coach", desc: "Offer coaching sessions, manage students, set availability & rates" },
    { id: "organizer", icon: "trophy", title: "Tournament Organizer", desc: "Create & promote tournaments, sell tickets, manage draws & brackets" },
    { id: "both", icon: "users", title: "Player + Coach", desc: "Play competitively AND coach other players from one account" },
  ];

  const getProgressSteps = () => {
    if (!selectedRole) return ["Role"];
    if (selectedRole === "organizer") return ["Role", "Basics", "Tournament Setup", "Done"];
    if (selectedRole === "both") return ["Role", "Basics", "Player", "Coach", "Done"];
    if (selectedRole === "player") return ["Role", "Basics", "Player", "Done"];
    if (selectedRole === "coach") return ["Role", "Basics", "Coach", "Done"];
    return ["Role"];
  };

  const progressSteps = getProgressSteps();

  if (step === 0) {
    return (
      <div style={{ padding: 20 }}>
        <h2 style={{ fontSize: 22, fontWeight: 700, color: theme.text, margin: "0 0 6px" }}>How will you use TennisAce?</h2>
        <p style={{ color: theme.textSecondary, fontSize: 14, margin: "0 0 24px" }}>Select your role. You can change this later in Settings.</p>

        {roles.map(role => (
          <button key={role.id} onClick={() => setSelectedRole(role.id)}
            style={{
              display: "flex", alignItems: "center", width: "100%", padding: 18, marginBottom: 12,
              background: selectedRole === role.id ? theme.primaryLight : theme.cardBg,
              border: `2px solid ${selectedRole === role.id ? theme.primary : theme.border}`,
              borderRadius: 12, cursor: "pointer", textAlign: "left", transition: "all 0.2s"
            }}>
            <div style={{
              width: 52, height: 52, borderRadius: 8,
              background: selectedRole === role.id ? theme.primary : theme.surfaceAlt,
              display: "flex", alignItems: "center", justifyContent: "center", marginRight: 16, transition: "all 0.2s"
            }}>
              {Icons[role.icon](selectedRole === role.id ? "#fff" : theme.primary, 26)}
            </div>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 17, fontWeight: 700, color: theme.text }}>{role.title}</div>
              <div style={{ fontSize: 13, color: theme.textSecondary, marginTop: 3, lineHeight: 1.4 }}>{role.desc}</div>
            </div>
            {selectedRole === role.id && (
              <div style={{ width: 24, height: 24, borderRadius: 12, background: theme.primary, display: "flex", alignItems: "center", justifyContent: "center" }}>
                {Icons.check("#fff", 14)}
              </div>
            )}
          </button>
        ))}

        {selectedRole && (
          <button onClick={() => setStep(1)}
            style={{ width: "100%", padding: 16, background: theme.primary, color: "#fff", border: "none", borderRadius: 12, fontSize: 16, fontWeight: 700, cursor: "pointer", marginTop: 16, display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
            Continue {Icons.chevronRight("#fff", 18)}
          </button>
        )}
      </div>
    );
  }

  if (step === 1) {
    return (
      <div style={{ padding: 20 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 20 }}>
          <button onClick={() => setStep(0)} style={{ background: "none", border: "none", cursor: "pointer" }} aria-label="Go back">{Icons.chevronLeft(theme.primary, 22)}</button>
          <h2 style={{ fontSize: 20, fontWeight: 700, color: theme.text, margin: 0 }}>Account Basics</h2>
        </div>

        <div style={{ display: "flex", gap: 6, marginBottom: 24 }}>
          {progressSteps.map((s, i) => (
            <div key={i} style={{ flex: 1, height: 4, borderRadius: 2, background: i <= 1 ? theme.primary : theme.border }} />
          ))}
        </div>

        <FormField label="Full Name" placeholder="John Smith" theme={theme} />
        <FormField label="Email" placeholder="john@email.com" theme={theme} type="email" />
        <FormField label="Phone (optional)" placeholder="+1 (555) 123-4567" theme={theme} />
        <FormField label="Location" placeholder="Auto-detected: New York, NY" theme={theme} icon="target" />

        <div style={{ marginTop: 8, marginBottom: 16 }}>
          <label style={{ fontSize: 13, fontWeight: 600, color: theme.textSecondary, display: "block", marginBottom: 8 }}>Profile Photo</label>
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            <div style={{ width: 56, height: 56, borderRadius: 28, background: theme.primaryLight, display: "flex", alignItems: "center", justifyContent: "center" }}>
              {Icons.camera(theme.primary, 24)}
            </div>
            <button onClick={() => alert("Photo uploaded!")} style={{ padding: "8px 16px", background: "none", border: `1px solid ${theme.border}`, borderRadius: 8, fontSize: 13, color: theme.primary, fontWeight: 600, cursor: "pointer" }}>Upload Photo</button>
          </div>
        </div>

        <button onClick={() => {
          if (selectedRole === "organizer") navigate("organizerAssessment");
          else if (selectedRole === "player") navigate("playerAssessment");
          else if (selectedRole === "coach") navigate("coachAssessment");
          else if (selectedRole === "both") navigate("playerAssessment");
          else navigate("playerAssessment");
        }}
          style={{ width: "100%", padding: 16, background: theme.primary, color: "#fff", border: "none", borderRadius: 12, fontSize: 16, fontWeight: 700, cursor: "pointer", marginTop: 8, display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
          {selectedRole === "organizer" ? "Set Up Tournament" : selectedRole === "coach" ? "Start Coach Assessment" : "Start Player Assessment"}
          {Icons.chevronRight("#fff", 18)}
        </button>
      </div>
    );
  }

  return null;
}

// ── ASSESSMENT SCREEN (Player & Coach) ──
function AssessmentScreen({ theme, navigate, type }) {
  const [currentQ, setCurrentQ] = useState(0);
  const [answers, setAnswers] = useState({});
  const questions = type === "player" ? PLAYER_QUESTIONS : COACH_QUESTIONS;
  const total = questions.length;
  const progress = ((currentQ + 1) / total) * 100;

  const handleNext = () => {
    if (currentQ < total - 1) setCurrentQ(currentQ + 1);
    else navigate(type === "player" ? "scoreResult" : "coachScoreResult");
  };

  return (
    <div style={{ padding: 20, display: "flex", flexDirection: "column", minHeight: 700 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
        <h2 style={{ fontSize: 18, fontWeight: 700, color: theme.text, margin: 0 }}>
          {type === "player" ? "Player" : "Coach"} Assessment
        </h2>
        <span style={{ fontSize: 14, fontWeight: 600, color: theme.primary }}>{currentQ + 1} / {total}</span>
      </div>

      <div style={{ height: 6, borderRadius: 3, background: theme.border, marginBottom: 24, overflow: "hidden" }}>
        <div style={{ height: "100%", width: `${progress}%`, background: theme.primary, borderRadius: 3, transition: "width 0.4s ease" }} />
      </div>

      <div style={{ background: theme.surfaceAlt, borderRadius: 12, padding: 20, marginBottom: 20 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
          <div style={{ width: 32, height: 32, borderRadius: 8, background: theme.primary, display: "flex", alignItems: "center", justifyContent: "center" }}>
            <span style={{ color: "#fff", fontSize: 14, fontWeight: 700 }}>Q{currentQ + 1}</span>
          </div>
          <span style={{ fontSize: 16, fontWeight: 600, color: theme.text, lineHeight: 1.4, flex: 1 }}>{questions[currentQ].q}</span>
        </div>
      </div>

      <div style={{ flex: 1 }}>
        {questions[currentQ].opts.map((opt, i) => (
          <button key={i} onClick={() => setAnswers({ ...answers, [currentQ]: i })}
            style={{
              display: "flex", alignItems: "center", width: "100%", padding: 14, marginBottom: 8,
              background: answers[currentQ] === i ? theme.primaryLight : theme.cardBg,
              border: `2px solid ${answers[currentQ] === i ? theme.primary : theme.border}`,
              borderRadius: 8, cursor: "pointer", textAlign: "left", transition: "all 0.15s"
            }}>
            <div style={{
              width: 28, height: 28, borderRadius: 14,
              border: `2px solid ${answers[currentQ] === i ? theme.primary : theme.border}`,
              background: answers[currentQ] === i ? theme.primary : "transparent",
              display: "flex", alignItems: "center", justifyContent: "center", marginRight: 12, flexShrink: 0
            }}>
              {answers[currentQ] === i && Icons.check("#fff", 14)}
            </div>
            <span style={{ fontSize: 15, color: theme.text, lineHeight: 1.3 }}>{opt}</span>
          </button>
        ))}
      </div>

      <button onClick={handleNext}
        style={{ width: "100%", padding: 16, background: theme.primary, color: "#fff", border: "none", borderRadius: 12, fontSize: 16, fontWeight: 700, cursor: "pointer", marginTop: 16, display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
        {currentQ === total - 1 ? "See Results" : "Next Question"} {Icons.chevronRight("#fff", 18)}
      </button>
    </div>
  );
}

// ── AVAILABILITY HEATMAP HELPERS ──
// Each session: "open" (>50% available), "busy" (<50% available), "full" (fully booked)
// Simulated based on day index + optional seed
function getDateHeatmap(dayIdx, seed = 0) {
  const patterns = [
    { morn: "open", aftn: "open", nite: "busy" },
    { morn: "open", aftn: "busy", nite: "full" },
    { morn: "busy", aftn: "open", nite: "open" },
    { morn: "full", aftn: "busy", nite: "open" },
    { morn: "open", aftn: "full", nite: "busy" },
    { morn: "full", aftn: "full", nite: "busy" },
    { morn: "busy", aftn: "busy", nite: "full" },
  ];
  return patterns[(dayIdx + seed) % patterns.length];
}

function getCourtHeatmap(courtIdx) {
  const patterns = [
    { morn: "open", aftn: "busy", nite: "open" },
    { morn: "open", aftn: "open", nite: "full" },
    { morn: "full", aftn: "full", nite: "full" },
    { morn: "busy", aftn: "open", nite: "busy" },
    { morn: "open", aftn: "busy", nite: "full" },
    { morn: "full", aftn: "open", nite: "open" },
  ];
  return patterns[courtIdx % patterns.length];
}

const heatColor = (level, selected) => {
  if (selected) {
    const map = { open: "rgba(255,255,255,0.9)", busy: "rgba(255,255,255,0.45)", full: "rgba(255,255,255,0.15)" };
    return map[level];
  }
  const map = { open: "#2EAF6E", busy: "#F5A623", full: "#E8344E" };
  return map[level];
};

function HeatBar({ heatmap, selected, size = "normal" }) {
  const barH = size === "small" ? 3 : 4;
  const barW = size === "small" ? 10 : 12;
  const gap = 2;
  return (

          <button
            onClick={() => setMemberToggle(!memberToggle)}
            role="switch"
            aria-checked={memberToggle}
            style={{ width: 42, height: 24, borderRadius: 12, background: memberToggle ? theme.success : theme.border, border: "none", cursor: "pointer", position: "relative", transition: "all 0.2s" }}>
            <div style={{ width: 18, height: 18, borderRadius: 9, background: "#fff", position: "absolute", top: 3, left: memberToggle ? 21 : 3, transition: "left 0.2s", boxShadow: "0 1px 2px rgba(0,0,0,0.2)" }} />
          </button>
        </div>

        <div style={{
          borderBottom: `1px solid ${theme.border}`,
          padding: `${ROW_PAD}px 16px`, display: "flex", alignItems: "center", gap: 6,
        }}>
          {Icons.grid(theme.primary, 14)}
          <span style={{ fontSize: 13, fontWeight: 700, color: theme.text, flex: 1 }}>Availability & Pricing</span>
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            {[
              { label: ">50%", color: "#2EAF6E" },
              { label: "<50%", color: "#F5A623" },
              { label: "Full", color: "#E8344E" },
            ].map(l => (
              <div key={l.label} style={{ display: "flex", alignItems: "center", gap: 2 }}>
                <div style={{ width: 8, height: 3, borderRadius: 1, background: l.color }} />
                <span style={{ fontSize: 11, color: theme.textSecondary }}>{l.label}</span>
              </div>
            ))}
          </div>
        </div>

        <div style={{ borderBottom: `1px solid ${theme.border}` }}>
          <div ref={stickyHeaderRef} style={{ overflow: "hidden", WebkitOverflowScrolling: "touch" }}>
            <div style={{ display: "flex", minWidth: matrixMinW, padding: `${ROW_PAD}px 12px` }}>
              <div style={{ width: TIME_COL, flexShrink: 0 }} />
              {courts.map((court) => (
                  <div key={court.id} style={{ width: COURT_COL, flexShrink: 0, textAlign: "center" }}>
                    <div style={{ fontSize: 11, fontWeight: 700, color: theme.text }}>{court.name}</div>
                    <div style={{ display: "flex", gap: 2, justifyContent: "center", marginTop: 2 }}>
                      <span style={{ fontSize: 9, padding: "1px 3px", borderRadius: 2, background: court.surface === "Clay" ? "#FBE8E0" : "#E3EDF7", color: court.surface === "Clay" ? "#C1440E" : "#00529B", fontWeight: 600 }}>{court.surface}</span>
                      <span style={{ fontSize: 9, padding: "1px 3px", borderRadius: 2, background: court.env === "Indoor" ? "#E0F0FF" : "#F0F5EB", color: court.env === "Indoor" ? "#0077C8" : "#4A6750", fontWeight: 600 }}>{court.env}</span>
                    </div>
                  </div>
              ))}
            </div>
          </div>
        </div>
      </div>

      <div>
        <div ref={matrixBodyRef} onScroll={handleMatrixHScroll}
          style={{ overflowX: "auto", WebkitOverflowScrolling: "touch", paddingBottom: 8 }}>
          <div style={{ minWidth: matrixMinW, padding: "0 12px" }}>
            {timeSlots.map((slot, tIdx) => {
              const isPeakRow = slot.period === "peak";
              const isNightRow = slot.lighting === "night";
              return (
                <div key={tIdx} style={{
                  display: "flex", alignItems: "stretch",
                  background: isPeakRow ? "#FFF9F0" : tIdx % 2 === 0 ? theme.surfaceAlt : theme.surface,
                  borderTop: tIdx === 0 ? `1px solid ${theme.border}` : undefined,
                  borderBottom: `1px solid ${theme.border}`,
                }}>
                  <div style={{
                    width: TIME_COL, flexShrink: 0, display: "flex", flexDirection: "column",
                    alignItems: "flex-end", justifyContent: "center", padding: "6px 6px 6px 0",
                    position: "sticky", left: 0, zIndex: 3,
                    background: isPeakRow ? "#FFF9F0" : tIdx % 2 === 0 ? theme.surfaceAlt : theme.surface,
                    borderRight: `1px solid ${theme.border}`,
                  }}>
                    <span style={{ fontSize: 11, fontWeight: 600, color: theme.text }}>{slot.label}</span>
                    <div style={{ display: "flex", gap: 2, marginTop: 2 }}>
                      {isPeakRow && <span style={{ display: "flex", alignItems: "center" }}>{Icons.zap("#F5A623", 9)}</span>}
                      {isNightRow && <span style={{ display: "flex", alignItems: "center" }}>{Icons.moon("#4A6785", 9)}</span>}
                    </div>
                  </div>

                  {courts.map(court => {
                    const key = cellKey(court.id, tIdx);
                    const isBooked = bookedCells.has(key) || court.status === "booked";
                    const isSelected = selectedCells.includes(key);
                    const noLights = isNightRow && !court.lights;
                    const unavailable = isBooked || noLights;
                    const price = getPrice(court, slot);

                    return (
                      <button key={court.id}
                        onClick={() => !unavailable && setSelectedCells(prev => prev.includes(key) ? prev.filter(k => k !== key) : [...prev, key])}
                        disabled={unavailable}
                        style={{
                          width: COURT_COL, flexShrink: 0, padding: "6px 3px", border: "none",
                          cursor: unavailable ? "not-allowed" : "pointer",
                          borderLeft: `1px solid ${theme.border}`,
                          background: unavailable ? (noLights ? "#F0F0F0" : "#FAFAFA")
                            : isSelected ? theme.primary : "transparent",
                          opacity: unavailable ? 0.4 : 1,
                          display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
                          transition: "all 0.12s", minHeight: 54,
                        }}>
                        {unavailable ? (
                          noLights ? (
                            <span style={{ fontSize: 11, color: "#999", fontWeight: 500 }}>No lights</span>
                          ) : (
                            <span style={{ fontSize: 11, color: "#bbb", fontWeight: 600 }}>Booked</span>
                          )
                        ) : (
                          <>
                            <span style={{ fontSize: 14, fontWeight: 800, color: isSelected ? "#fff" : theme.primary }}>${price}</span>
                            <div style={{ display: "flex", flexWrap: "wrap", gap: 1, justifyContent: "center", marginTop: 2 }}>
                              {isPeakRow && (
                                <span style={{ fontSize: 9, padding: "0px 2px", borderRadius: 2, background: isSelected ? "rgba(255,255,255,0.2)" : "#FFF3E0", color: isSelected ? "rgba(255,255,255,0.85)" : "#E65100", fontWeight: 600 }}>Peak</span>
                              )}
                              {!isPeakRow && (
                                <span style={{ fontSize: 9, padding: "0px 2px", borderRadius: 2, background: isSelected ? "rgba(255,255,255,0.2)" : "#E8F5E9", color: isSelected ? "rgba(255,255,255,0.85)" : "#2E7D32", fontWeight: 600 }}>Off-Pk</span>
                              )}
                              {isNightRow && (
                                <span style={{ fontSize: 9, padding: "0px 2px", borderRadius: 2, background: isSelected ? "rgba(255,255,255,0.2)" : "#E8EAF6", color: isSelected ? "rgba(255,255,255,0.85)" : "#4A6785", fontWeight: 600 }}>Night</span>
                              )}
                              {!isNightRow && (
                                <span style={{ fontSize: 9, padding: "0px 2px", borderRadius: 2, background: isSelected ? "rgba(255,255,255,0.2)" : "#FFFDE7", color: isSelected ? "rgba(255,255,255,0.85)" : "#F5A623", fontWeight: 600 }}>Day</span>
                              )}
                            </div>
                            <div style={{ display: "flex", gap: 1, marginTop: 1 }}>
                              {court.env === "Indoor" && (
                                <span style={{ fontSize: 9, padding: "0px 2px", borderRadius: 2, background: isSelected ? "rgba(255,255,255,0.2)" : "#E0F0FF", color: isSelected ? "rgba(255,255,255,0.85)" : "#0077C8", fontWeight: 600 }}>Indoor</span>
                              )}
                              {memberToggle && (
                                <span style={{ fontSize: 9, padding: "0px 2px", borderRadius: 2, background: isSelected ? "rgba(255,255,255,0.2)" : "#E8F5E9", color: isSelected ? "rgba(255,255,255,0.85)" : "#2E7D32", fontWeight: 600 }}>Mem</span>
                              )}
                              {!memberToggle && (
                                <span style={{ fontSize: 9, padding: "0px 2px", borderRadius: 2, background: isSelected ? "rgba(255,255,255,0.15)" : "#FBE8E0", color: isSelected ? "rgba(255,255,255,0.7)" : "#C1440E", fontWeight: 500 }}>Non-Mem</span>
                              )}
                            </div>
                          </>
                        )}
                      </button>
                    );
                  })}
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {selectedCells.length > 0 && (() => {
        const cartItems = selectedCells.map(key => {
          const [cId, tIdx] = key.split("-");
          const court = courts.find(c => c.id === cId);
          const slot = timeSlots[parseInt(tIdx)];
          if (!court || !slot) return null;
          return { key, court, slot, price: getPrice(court, slot) };
        }).filter(Boolean);
        const total = cartItems.reduce((s, i) => s + i.price, 0);
        return (
          <div style={{ padding: "10px 16px 16px", borderTop: `1px solid ${theme.border}`, background: theme.cardBg }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
              <div style={{ fontSize: 14, fontWeight: 700, color: theme.text }}>
                {cartItems.length} Court{cartItems.length > 1 ? "s" : ""} Selected
              </div>
              <div style={{ fontSize: 20, fontWeight: 800, color: theme.primary }}>${total}.00</div>
            </div>
            <div style={{ maxHeight: 140, overflowY: "auto", marginBottom: 10 }}>
              {cartItems.map(item => (
                <div key={item.key} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "6px 0", borderBottom: `1px solid ${theme.border}` }}>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 13, fontWeight: 600, color: theme.text }}>{item.court.name} at {item.slot.time}</div>
                    <div style={{ display: "flex", gap: 4, marginTop: 2 }}>
                      <span style={{ fontSize: 10, padding: "1px 5px", borderRadius: 3, background: item.slot.period === "peak" ? "#FFF3E0" : "#E8F5E9", color: item.slot.period === "peak" ? "#E65100" : "#2E7D32", fontWeight: 600 }}>{item.slot.period === "peak" ? "Peak" : "Off-Peak"}</span>
                      <span style={{ fontSize: 10, padding: "1px 5px", borderRadius: 3, background: "#E3EDF7", color: "#00529B", fontWeight: 600 }}>{item.court.surface}</span>
                    </div>
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <span style={{ fontSize: 14, fontWeight: 700, color: theme.primary }}>${item.price}</span>
                    <button onClick={() => setSelectedCells(prev => prev.filter(k => k !== item.key))}
                      style={{ width: 22, height: 22, borderRadius: 11, background: theme.surfaceAlt, border: `1px solid ${theme.border}`, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, color: theme.textSecondary, fontWeight: 700 }}>×</button>
                  </div>
                </div>
              ))}
            </div>
            {navContext.from !== "coachProfile" && (
              <button onClick={() => navigate("findCoach", { from: "bookCourt" })}
                style={{ width: "100%", padding: 14, marginBottom: 8, background: theme.cardBg, border: `2px solid ${theme.primary}`, borderRadius: 12, fontSize: 14, fontWeight: 700, color: theme.primary, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
                {Icons.coach(theme.primary, 18)} Book a Coach for This Session
              </button>
            )}
            <button onClick={() => navigate("bookPayment", { from: "bookCourt", courtCount: selectedCells.length })}
              style={{ width: "100%", padding: 14, background: theme.primary, color: "#fff", border: "none", borderRadius: 12, fontSize: 16, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
              {Icons.arrowRight("#fff", 18)} Continue to Payment — ${total}.00
            </button>
          </div>
        );
      })()}
    </div>
  );
}

// CARRIED FROM V2: TOURNAMENT ORG SETUP SCREEN (with improvements)
// ─────────────────────────────────────────────────────────────────────────
function TournamentOrgSetupScreen({ theme, navigate }) {
  const [step, setStep] = useState(0);
  const [tournamentType, setTournamentType] = useState(null);

  const types = [
    { id: "singles", label: "Singles", desc: "Individual knockout or round-robin" },
    { id: "doubles", label: "Doubles", desc: "Paired teams competing together" },
    { id: "mixed", label: "Mixed Doubles", desc: "Male-female paired teams" },
    { id: "junior", label: "Junior", desc: "Age-restricted youth tournament" },
    { id: "social", label: "Social / Round Robin", desc: "Casual rotating partners event" },

  if (step === 0) {
    return (
      <div style={{ padding: 20 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 6 }}>
          {Icons.trophy(theme.primary, 28)}
          <h2 style={{ fontSize: 22, fontWeight: 700, color: theme.text, margin: 0 }}>Create Tournament</h2>
        </div>
        <p style={{ color: theme.textSecondary, fontSize: 14, margin: "0 0 24px" }}>Set up your event, promote it, and sell tickets.</p>

        {/* Progress */}
        <div style={{ display: "flex", gap: 6, marginBottom: 24 }}>
          {["Details", "Format", "Tickets", "Promote", "Publish"].map((s, i) => (
            <div key={i} style={{ flex: 1 }}>
              <div style={{ height: 4, borderRadius: 2, background: i === 0 ? theme.primary : theme.border, marginBottom: 4 }} />
              <span style={{ fontSize: 11, color: i === 0 ? theme.primary : theme.textSecondary, fontWeight: 600 }}>{s}</span>
            </div>
          ))}
        </div>

        <FormField label="Tournament Name" placeholder='e.g. "Summer Slam Open 2026"' theme={theme} />
        <FormField label="Venue" placeholder="Search venues or enter address" theme={theme} icon="mapPin" />

        <div style={{ display: "flex", gap: 12, marginBottom: 16 }}>
          <div style={{ flex: 1 }}>
            <label style={{ fontSize: 13, fontWeight: 600, color: theme.textSecondary, display: "block", marginBottom: 6 }}>Start Date</label>

          </div>
          <div style={{ flex: 1 }}>
            <label style={{ fontSize: 13, fontWeight: 600, color: theme.textSecondary, display: "block", marginBottom: 6 }}>End Date</label>
            <div style={{ padding: 12, background: theme.surfaceAlt, border: `1px solid ${theme.border}`, borderRadius: 12, fontSize: 14, color: theme.text, display: "flex", alignItems: "center", gap: 6 }}>

        <label style={{ fontSize: 13, fontWeight: 600, color: theme.textSecondary, display: "block", marginBottom: 8 }}>Tournament Format</label>

          <button key={t.id} onClick={() => setTournamentType(t.id)}

              display: "flex", alignItems: "center", width: "100%", padding: 14, marginBottom: 8,
              background: tournamentType === t.id ? theme.primaryLight : theme.cardBg,
              border: `2px solid ${tournamentType === t.id ? theme.primary : theme.border}`,

            <div key={i} style={{ flex: 1 }}>
              <div style={{ height: 4, borderRadius: 2, background: i <= 2 ? theme.primary : theme.border, marginBottom: 4 }} />

        <p style={{ color: theme.textSecondary, fontSize: 13, margin: "0 0 20px" }}>Define ticket tiers for participants and spectators. You can add or remove tiers anytime before publishing.</p>

          <div key={i} style={{ background: theme.cardBg, border: `1px solid ${theme.border}`, borderRadius: 12, padding: 16, marginBottom: 12 }}>

                </div>
                <div>
                  <div style={{ fontSize: 15, fontWeight: 700, color: theme.text }}>{tier.name}</div>
                  <div style={{ fontSize: 12, color: theme.textSecondary }}>{tier.perks}</div>
                </div>
              </div>
              <span style={{ fontSize: 20, fontWeight: 800, color: theme.primary }}>{tier.price}</span>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <div style={{ flex: 1, padding: "8px 10px", background: theme.surfaceAlt, borderRadius: 8, fontSize: 12, color: theme.textSecondary }}>
                Capacity: <span style={{ fontWeight: 700, color: theme.text }}>{i === 2 ? "100" : "32"}</span>
              </div>
              <div style={{ flex: 1, padding: "8px 10px", background: theme.surfaceAlt, borderRadius: 8, fontSize: 12, color: theme.textSecondary }}>
                Sold: <span style={{ fontWeight: 700, color: theme.success }}>0</span>
              </div>
            </div>
          </div>
        ))}

        <button onClick={() => alert("Ticket tier added!")} style={{ width: "100%", padding: 12, background: "none", border: `2px dashed ${theme.border}`, borderRadius: 12, fontSize: 14, fontWeight: 600, color: theme.primary, cursor: "pointer", marginBottom: 16, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }} aria-label="Add Ticket Tier">

        {/* Revenue estimate */}
        <div style={{ background: theme.success + "12", border: `1px solid ${theme.success}44`, borderRadius: 12, padding: 14, marginBottom: 16 }}>
          <div style={{ fontSize: 11, fontWeight: 600, color: theme.success, textTransform: "uppercase", letterSpacing: 0.5 }}>Estimated Revenue (if sold out)</div>

          <div style={{ fontSize: 11, color: theme.textSecondary, marginTop: 2 }}>32 × $25 + 32 × $55 + 100 × $15</div>

        <button onClick={() => setStep(2)} aria-label="Set Up Promotion"

          Set Up Promotion {Icons.chevronRight("#fff", 18)}
        </button>
      </div>
    );
  }

  if (step === 2) {
    return (
      <div style={{ padding: 20 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
          <button onClick={() => setStep(1)} style={{ background: "none", border: "none", cursor: "pointer" }} aria-label="Back">
            {Icons.chevronLeft(theme.primary, 22)}
          </button>
          <h2 style={{ fontSize: 20, fontWeight: 700, color: theme.text, margin: 0 }}>Promote Your Tournament</h2>
        </div>

        {/* Progress */}
        <div style={{ display: "flex", gap: 6, marginBottom: 24, marginTop: 12 }}>
          {["Details", "Format", "Tickets", "Promote", "Publish"].map((s, i) => (
            <div key={i} style={{ flex: 1 }}>
              <div style={{ height: 4, borderRadius: 2, background: i <= 3 ? theme.primary : theme.border, marginBottom: 4 }} />
              <span style={{ fontSize: 11, color: i <= 3 ? theme.primary : theme.textSecondary, fontWeight: 600 }}>{s}</span>
            </div>
          ))}
        </div>

        {/* Banner upload */}
        <div style={{ marginBottom: 20 }}>
          <label style={{ fontSize: 13, fontWeight: 600, color: theme.textSecondary, display: "block", marginBottom: 8 }}>Tournament Banner</label>
          <div style={{ height: 140, background: theme.surfaceAlt, border: `2px dashed ${theme.border}`, borderRadius: 12, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", cursor: "pointer" }}>
            {Icons.image(theme.textSecondary, 32)}
            <span style={{ fontSize: 13, color: theme.textSecondary, marginTop: 8 }}>Tap to upload banner image</span>
            <span style={{ fontSize: 11, color: theme.border, marginTop: 2 }}>Recommended: 1200 × 630px</span>
          </div>
        </div>

        {/* Description */}
        <div style={{ marginBottom: 20 }}>
          <label style={{ fontSize: 13, fontWeight: 600, color: theme.textSecondary, display: "block", marginBottom: 6 }}>Event Description</label>
          <div style={{ minHeight: 90, padding: 12, background: theme.surfaceAlt, border: `1px solid ${theme.border}`, borderRadius: 12, fontSize: 13, color: theme.textSecondary, lineHeight: 1.5 }}>
            Join us for the Summer Slam Open! Three days of competitive tennis with prizes for all divisions. Food, drinks, and live music on finals day...
          </div>
        </div>

        {/* Promotion channels */}
        <label style={{ fontSize: 13, fontWeight: 600, color: theme.textSecondary, display: "block", marginBottom: 10 }}>Promotion Channels</label>
        {[
          { label: "Push Notification", desc: "Notify all TennisAce players within 25mi", icon: "megaphone", active: true },
          { label: "In-App Featured", desc: "Show in 'Upcoming Tournaments' feed", icon: "star", active: true },
          { label: "Social Media Share", desc: "Generate shareable link & graphics", icon: "send", active: false },
        ].map((ch, i) => (
          <div key={i} style={{ display: "flex", alignItems: "center", padding: 14, marginBottom: 8, background: ch.active ? theme.primaryLight : theme.cardBg, border: `1px solid ${ch.active ? theme.primary + "55" : theme.border}`, borderRadius: 12 }}>
            <div style={{ width: 36, height: 36, borderRadius: 12, background: ch.active ? theme.primary : theme.surfaceAlt, display: "flex", alignItems: "center", justifyContent: "center", marginRight: 12 }}>
              {Icons[ch.icon](ch.active ? "#fff" : theme.textSecondary, 18)}
            </div>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 14, fontWeight: 600, color: theme.text }}>{ch.label}</div>
              <div style={{ fontSize: 11, color: theme.textSecondary, marginTop: 1 }}>{ch.desc}</div>
            </div>
            <div style={{
              width: 42, height: 24, borderRadius: 20,
              background: ch.active ? theme.success : theme.border,
              position: "relative", cursor: "pointer", role: "switch", "aria-checked": ch.active
            }}>
              <div style={{ width: 18, height: 18, borderRadius: 9, background: "#fff", position: "absolute", top: 3, left: ch.active ? 21 : 3, boxShadow: "0 1px 2px rgba(0,0,0,0.2)" }} />
            </div>
          </div>
        ))}

        <button onClick={() => setStep(3)} aria-label="Publish Tournament"
          style={{ width: "100%", padding: 16, background: theme.primary, color: "#fff", border: "none", borderRadius: 12, fontSize: 16, fontWeight: 700, cursor: "pointer", marginTop: 16, display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
          {Icons.checkCircle("#fff", 18)} Publish Tournament
        </button>
      </div>
    );
  }

  // step === 3: Published confirmation
  return (
    <div style={{ padding: 20, textAlign: "center" }}>
      <div style={{ width: 80, height: 80, borderRadius: 40, background: theme.success + "18", display: "flex", alignItems: "center", justifyContent: "center", margin: "30px auto 16px" }}>
        <div style={{ width: 56, height: 56, borderRadius: 28, background: theme.success, display: "flex", alignItems: "center", justifyContent: "center" }}>
          {Icons.trophy("#fff", 28)}
        </div>
      </div>
      <h2 style={{ fontSize: 22, fontWeight: 800, color: theme.text, margin: "0 0 6px" }}>Tournament Published!</h2>
      <p style={{ color: theme.textSecondary, fontSize: 14, margin: "0 0 28px" }}>Your event is live and visible to players nearby.</p>

      <div style={{ background: theme.gradient, borderRadius: 20, padding: 20, marginBottom: 20, textAlign: "left" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14 }}>
          {Icons.trophy("#fff", 20)}
          <span style={{ color: "#fff", fontSize: 16, fontWeight: 700 }}>Summer Slam Open 2026</span>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
          <div>
            <div style={{ fontSize: 11, color: "rgba(255,255,255,0.6)", fontWeight: 600, textTransform: "uppercase" }}>Format</div>
            <div style={{ fontSize: 14, color: "#fff", fontWeight: 700, marginTop: 2 }}>{tournamentType === "doubles" ? "Doubles" : tournamentType === "mixed" ? "Mixed Doubles" : tournamentType === "junior" ? "Junior" : tournamentType === "social" ? "Social" : "Singles"}</div>
          </div>
          <div>
            <div style={{ fontSize: 11, color: "rgba(255,255,255,0.6)", fontWeight: 600, textTransform: "uppercase" }}>Dates</div>
            <div style={{ fontSize: 14, color: "#fff", fontWeight: 700, marginTop: 2 }}>Apr 15 - 17</div>
          </div>
          <div>
            <div style={{ fontSize: 11, color: "rgba(255,255,255,0.6)", fontWeight: 600, textTransform: "uppercase" }}>Tickets</div>
            <div style={{ fontSize: 14, color: "#fff", fontWeight: 700, marginTop: 2 }}>3 tiers</div>
          </div>
          <div>
            <div style={{ fontSize: 11, color: "rgba(255,255,255,0.6)", fontWeight: 600, textTransform: "uppercase" }}>Revenue Goal</div>
            <div style={{ fontSize: 14, color: "#fff", fontWeight: 700, marginTop: 2 }}>$3,060</div>
          </div>
        </div>
        <div style={{ marginTop: 14, padding: "8px 12px", background: "rgba(255,255,255,0.12)", borderRadius: 8, display: "flex", justifyContent: "space-between" }}>
          <span style={{ fontSize: 11, color: "rgba(255,255,255,0.7)" }}>Event ID</span>
          <span style={{ fontSize: 13, fontWeight: 700, color: "#fff", letterSpacing: 1 }}>TA-TOURN-0042</span>
        </div>
      </div>

      {/* Live stats preview */}
      <div style={{ background: theme.surfaceAlt, borderRadius: 12, padding: 16, marginBottom: 20 }}>
        <div style={{ fontSize: 13, fontWeight: 700, color: theme.text, marginBottom: 12 }}>Live Dashboard Preview</div>
        <div style={{ display: "flex", gap: 10 }}>
          {[
            { label: "Tickets Sold", val: "0 / 164", color: theme.primary },
            { label: "Revenue", val: "$0", color: theme.success },
            { label: "Views", val: "—", color: theme.warning },
          ].map((stat, i) => (
            <div key={i} style={{ flex: 1, padding: "10px 6px", background: theme.cardBg, borderRadius: 10, textAlign: "center", border: `1px solid ${theme.border}` }}>
              <div style={{ fontSize: 16, fontWeight: 800, color: stat.color }}>{stat.val}</div>
              <div style={{ fontSize: 11, color: theme.textSecondary, marginTop: 2, fontWeight: 600 }}>{stat.label}</div>
            </div>
          ))}
        </div>
      </div>

      <div style={{ display: "flex", gap: 10, marginBottom: 10 }}>
        <button onClick={() => alert("Link copied to clipboard!")} style={{ flex: 1, padding: 12, background: theme.surfaceAlt, border: `1px solid ${theme.border}`, borderRadius: 12, fontSize: 13, fontWeight: 600, color: theme.text, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }} aria-label="Share Link">
          {Icons.send(theme.primary, 14)} Share Link
        </button>
        <button onClick={() => navigate("stats")} style={{ flex: 1, padding: 12, background: theme.surfaceAlt, border: `1px solid ${theme.border}`, borderRadius: 12, fontSize: 13, fontWeight: 600, color: theme.text, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }} aria-label="Dashboard">
          {Icons.grid(theme.primary, 14)} Dashboard
        </button>
      </div>

      <button onClick={() => navigate("home")} aria-label="Back to Home"
        style={{ width: "100%", padding: 16, background: theme.primary, color: "#fff", border: "none", borderRadius: 12, fontSize: 16, fontWeight: 700, cursor: "pointer", marginTop: 6, display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
        {Icons.home("#fff", 18)} Back to Home
      </button>
    </div>
  );
}

// CARRIED FROM V2: FIND MATCH SCREEN (with improvements)
// ─────────────────────────────────────────────────────────────────────────
function FindMatchScreen({ theme, navigate }) {
  const [tab, setTab] = useState("find");
  const [showPost, setShowPost] = useState(false);
  const [filters, setFilters] = useState({ level: "all", time: "all", type: "all" });
  const [selectedReq, setSelectedReq] = useState(null);

  const levelLabels = { all: "All Levels", beginner: "Beginner (1.0-2.5)", intermediate: "Intermediate (3.0-3.5)", advanced: "Advanced (4.0-5.0)" };
  const timeLabels = { all: "Any Time", morning: "Morning", afternoon: "Afternoon", evening: "Evening" };
  const typeLabels = { all: "Any Type", singles: "Singles", doubles: "Doubles" };

  const requests = [
    { id: 1, name: "Alex R.", level: "3.5", avatar: "A", avatarKey: "alex", when: "Today, 4 - 6pm", where: "Sunrise Tennis Club", type: "Singles", msg: "Looking for a rally partner around 3.5 level. I can play forehand-heavy, happy to work on backhand too.", posted: "2h ago", distance: "0.8 mi" },
    { id: 2, name: "Maria L.", level: "4.0", avatar: "M", avatarKey: "maria", when: "Tomorrow, 9 - 11am", where: "Palm Court Center", type: "Singles", msg: "Need a hitting partner for match prep. Competitive rally, 4.0+. I have a court reserved.", posted: "45m ago", distance: "1.2 mi" },
    { id: 3, name: "James & Sarah", level: "3.0", avatar: "J", avatarKey: "james", avatarKey2: "sarah", when: "Sat, 2 - 4pm", where: "Any venue nearby", type: "Doubles", msg: "Couple looking for another pair for social doubles. We're around 3.0 NTRP. Bring drinks!", posted: "5h ago", distance: "—" },
    { id: 4, name: "Chris T.", level: "2.5", avatar: "C", avatarKey: "chris", when: "Flexible weekday eves", where: "Bayfront Courts", type: "Singles", msg: "Beginner-intermediate looking for regular weekly partner. Just getting back into tennis after years off.", posted: "1d ago", distance: "2.4 mi" },
    { id: 5, name: "Yuki M.", level: "4.5", avatar: "Y", avatarKey: "yuki", when: "Wed/Fri, 7 - 8am", where: "Sunrise Tennis Club", type: "Singles", msg: "Competitive 4.5 looking for early-morning hitting sessions. Consistent baseline game, working on serve-and-volley.", posted: "3h ago", distance: "0.8 mi" },
  ];

  const levelColor = (lvl) => {
    const n = parseFloat(lvl);
    if (n >= 4.0) return { bg: "#FDE8E8", text: "#C53030" };
    if (n >= 3.0) return { bg: "#FEF3C7", text: "#92400E" };
    return { bg: "#D1FAE5", text: "#065F46" };
  };

  if (showPost) {
    return (
      <div style={{ padding: 20 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 20 }}>
          <button onClick={() => setShowPost(false)} style={{ background: "none", border: "none", cursor: "pointer" }} aria-label="Back">
            {Icons.chevronLeft(theme.primary, 22)}
          </button>
          <h2 style={{ fontSize: 20, fontWeight: 700, color: theme.text, margin: 0 }}>Post a Match Request</h2>
        </div>

        <FormField label="Match Type" placeholder="Singles" theme={theme} />

        <div style={{ display: "flex", gap: 12, marginBottom: 0 }}>
          <div style={{ flex: 1 }}>
            <FormField label="Preferred Date" placeholder="e.g. This Saturday" theme={theme} />
          </div>
          <div style={{ flex: 1 }}>
            <FormField label="Time Window" placeholder="2pm - 5pm" theme={theme} />
          </div>
        </div>

        <FormField label="Preferred Venue (optional)" placeholder="Any venue nearby" theme={theme} icon="mapPin" />
        <FormField label="Your NTRP Level" placeholder="e.g. 3.5" theme={theme} />

        <div style={{ marginBottom: 20 }}>
          <label style={{ fontSize: 13, fontWeight: 600, color: theme.textSecondary, display: "block", marginBottom: 6 }}>Message to Potential Partners</label>
          <div style={{ minHeight: 80, padding: 12, background: theme.surfaceAlt, border: `1px solid ${theme.border}`, borderRadius: 12, fontSize: 14, color: theme.textSecondary }}>
            Describe what you're looking for...
          </div>
        </div>

        <button onClick={() => setShowPost(false)} aria-label="Post Match Request"
          style={{ width: "100%", padding: 16, background: theme.primary, color: "#fff", border: "none", borderRadius: 12, fontSize: 16, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
          {Icons.send("#fff", 18)} Post Match Request
        </button>
      </div>
    );
  }

  if (selectedReq !== null) {
    const r = requests.find(x => x.id === selectedReq);
    const lc = levelColor(r.level);
    return (
      <div style={{ padding: 20 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 20 }}>
          <button onClick={() => setSelectedReq(null)} style={{ background: "none", border: "none", cursor: "pointer" }} aria-label="Back">
            {Icons.chevronLeft(theme.primary, 22)}
          </button>
          <h2 style={{ fontSize: 20, fontWeight: 700, color: theme.text, margin: 0 }}>Match Details</h2>
        </div>

        {/* Player card */}
        <div style={{ background: theme.cardBg, border: `1px solid ${theme.border}`, borderRadius: 12, padding: 20, marginBottom: 16 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 16 }}>
            <Avatar src={r.avatarKey ? AVATARS[r.avatarKey] : null} name={r.name} size={56} border={true} borderColor={theme.border} />
            <div style={{ display: "none" }}>
              <span style={{ color: "#fff", fontSize: 22, fontWeight: 700 }}>{r.avatar}</span>
            </div>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 18, fontWeight: 700, color: theme.text }}>{r.name}</div>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 4 }}>
                <span style={{ fontSize: 12, padding: "3px 10px", borderRadius: 8, background: lc.bg, color: lc.text, fontWeight: 700 }}>NTRP {r.level}</span>

            <span style={{ position: "absolute", bottom: 8, right: 10, fontSize: 12, fontWeight: 700, color: "#fff", background: "rgba(0,0,0,0.45)", padding: "2px 10px", borderRadius: 8 }}>${coach.price}/hr</span>
          </div>
          <div style={{ padding: 14 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            <div style={{ position: "relative", flexShrink: 0 }}>
              <Avatar src={coach.avatarKey ? AVATARS[coach.avatarKey] : null} name={coach.name} size={44} border={true} borderColor={theme.border} />
              {coach.available && <div style={{ position: "absolute", bottom: 0, right: 0, width: 12, height: 12, borderRadius: 6, background: "#4CAF50", border: `2px solid ${theme.cardBg}` }} />}
            </div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 4 }}>
                <div style={{ fontSize: 14, fontWeight: 700, color: theme.text }}>{coach.name}</div>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 4 }}>
                <span style={{ fontSize: 12, fontWeight: 700, color: theme.warning }}>★ {coach.rating}</span>
                <span style={{ fontSize: 11, color: theme.textSecondary }}>({coach.reviews})</span>
                <span style={{ fontSize: 10, color: theme.textSecondary, marginLeft: "auto" }}>{coach.country}</span>
              </div>
              <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
                {coach.specialties.map((spec, i) => (
                  <span key={i} style={{ fontSize: 10, padding: "2px 6px", background: theme.primaryLight, color: theme.primary, borderRadius: 4, fontWeight: 600 }}>{spec}</span>
                ))}
              </div>
            </div>
          </div>
          </div>
        </button>
      ))}
    </div>
  );
}

// ────────────────────────────────────────────────────────────────────────
// 9. COACH PROFILE SCREEN
// ────────────────────────────────────────────────────────────────────────
function CoachProfileScreen({ theme, navigate, navContext = {} }) {
  const [selectedSessions, setSelectedSessions] = useState([]);
  const [selectedPack, setSelectedPack] = useState("single");
  const [selectedDate, setSelectedDate] = useState(2);
  const [weekOffset, setWeekOffset] = useState(0);

  const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  const dates = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(); d.setDate(d.getDate() + weekOffset * 7 + i);
    dates.push({ day: dayNames[d.getDay()], date: d.getDate(), month: monthNames[d.getMonth()], fullMonth: d.toLocaleString("en", { month: "long" }), year: d.getFullYear() });
  }
  const weekLabel = (() => {
    const first = dates[0]; const last = dates[6];
    if (first.month === last.month) return `${first.fullMonth} ${first.year}`;
    return `${first.month} - ${last.month} ${last.year}`;
  })();

  const packs = [
    { id: "single", name: "Single Session", price: 75, hours: 1, desc: "$75/hr" },
    { id: "pack5", name: "5-Pack", price: 340, hours: 5, desc: "$68/hr — Save $35" },
    { id: "pack10", name: "10-Pack", price: 650, hours: 10, desc: "$65/hr — Save $100" },
  ];

  const currentPack = packs.find(p => p.id === selectedPack);
  const packHours = currentPack.hours;
  const usedHours = selectedSessions.length;
  const remainingHours = Math.max(0, packHours - usedHours);

  const timeSlots = [
    { id: "t1", time: "8:00 AM", available: true },
    { id: "t2", time: "9:00 AM", available: true },
    { id: "t3", time: "10:00 AM", available: false },
    { id: "t4", time: "11:00 AM", available: true },
    { id: "t5", time: "12:00 PM", available: true },
    { id: "t6", time: "1:00 PM", available: false },
    { id: "t7", time: "2:00 PM", available: true },
    { id: "t8", time: "3:00 PM", available: true },
    { id: "t9", time: "4:00 PM", available: false },
    { id: "t10", time: "5:00 PM", available: true },
  ];

  const toggleSession = (slotId) => {
    setSelectedSessions(prev => {
      if (prev.includes(slotId)) return prev.filter(s => s !== slotId);
      if (prev.length >= packHours) return prev;
      return [...prev, slotId];
    });
  };

  const totalPrice = selectedPack === "single" ? selectedSessions.length * 75 : currentPack.price;

  return (
    <div style={{ paddingBottom: 40 }}>
      {/* Header */}
      <div style={{ background: theme.gradient, padding: "16px 20px", color: "#fff" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
          <div style={{ position: "relative", flexShrink: 0 }}>
            <Avatar src={AVATARS.mouratoglou} name="Coach Williams" size={56} border={true} borderColor="rgba(255,255,255,0.4)" />
            <div style={{ position: "absolute", bottom: 0, right: 0, width: 14, height: 14, borderRadius: 7, background: "#4CAF50", border: "2px solid rgba(255,255,255,0.3)" }} />
          </div>
          <div style={{ flex: 1 }}>
            <h2 style={{ fontSize: 18, fontWeight: 700, margin: "0 0 4px" }}>Coach Williams</h2>
            <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 4 }}>
              <span style={{ fontSize: 13, fontWeight: 700 }}>★ 4.8</span>
              <span style={{ fontSize: 12, opacity: 0.8 }}>(32 reviews)</span>
            </div>
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              {["Technique", "Strategy"].map((spec, i) => (
                <span key={i} style={{ fontSize: 10, padding: "2px 8px", background: "rgba(255,255,255,0.2)", borderRadius: 4, fontWeight: 600 }}>{spec}</span>
              ))}
            </div>
          </div>
        </div>
      </div>

      <div style={{ padding: "12px 16px 0" }}>
        {/* Bio — collapsible */}
        <p style={{ fontSize: 12, color: theme.textSecondary, lineHeight: 1.5, margin: "0 0 14px" }}>
          Former collegiate player with 15 years of coaching experience. Specializes in technique refinement and match strategy.
        </p>

        {/* Select a Pack */}
        <div style={{ marginBottom: 14 }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: theme.text, marginBottom: 8 }}>Select a Package</div>
          <div style={{ display: "flex", gap: 6 }}>
            {packs.map(pack => {
              const isSel = selectedPack === pack.id;
              return (
                <button key={pack.id} onClick={() => { setSelectedPack(pack.id); setSelectedSessions(prev => prev.slice(0, pack.hours)); }}
                  style={{
                    flex: 1, padding: "8px 4px", background: isSel ? theme.primaryLight : theme.cardBg,
                    border: `2px solid ${isSel ? theme.primary : theme.border}`, borderRadius: 10,
                    cursor: "pointer", textAlign: "center",
                  }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: isSel ? theme.primary : theme.text }}>{pack.name}</div>
                  <div style={{ fontSize: 15, fontWeight: 800, color: isSel ? theme.primary : theme.text, margin: "2px 0" }}>${pack.price}</div>
                  <div style={{ fontSize: 10, color: theme.textSecondary }}>{pack.desc}</div>
                </button>
              );
            })}
          </div>
        </div>

        {/* Date Picker */}
        <div style={{ marginBottom: 14 }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: theme.text, marginBottom: 8 }}>Select Date & Time</div>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6 }}>
            <button onClick={() => weekOffset > 0 && setWeekOffset(w => w - 1)}
              style={{ background: "none", border: "none", cursor: weekOffset > 0 ? "pointer" : "default", opacity: weekOffset > 0 ? 1 : 0.3, padding: 4, display: "flex", alignItems: "center" }}>
              {Icons.chevronLeft(theme.primary, 18)}
            </button>
            <span style={{ fontSize: 13, fontWeight: 700, color: theme.text }}>{weekLabel}</span>
            <button onClick={() => weekOffset < 12 && setWeekOffset(w => w + 1)}
              style={{ background: "none", border: "none", cursor: weekOffset < 12 ? "pointer" : "default", opacity: weekOffset < 12 ? 1 : 0.3, padding: 4, display: "flex", alignItems: "center" }}>
              {Icons.chevronRight(theme.primary, 18)}
            </button>
          </div>
          <div style={{ display: "flex", gap: 4, justifyContent: "center" }}>
            {dates.map((d, i) => {
              const sel = selectedDate === i;
              return (
                <button key={`${weekOffset}-${i}`} onClick={() => setSelectedDate(i)}
                  style={{
                    flex: 1, maxWidth: 46, padding: "4px 2px 5px", borderRadius: 10, cursor: "pointer", textAlign: "center",
                    background: sel ? theme.primary : theme.cardBg,
                    border: `1px solid ${sel ? theme.primary : theme.border}`,
                  }}>
                  <div style={{ fontSize: 11, fontWeight: 600, color: sel ? "rgba(255,255,255,0.65)" : theme.textSecondary }}>{d.day}</div>
                  <div style={{ fontSize: 15, fontWeight: 700, color: sel ? "#fff" : theme.text, lineHeight: 1.2 }}>{d.date}</div>
                </button>
              );
            })}
          </div>
        </div>

        {/* Time Slots */}
        <div style={{ marginBottom: 14 }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
            <span style={{ fontSize: 12, fontWeight: 600, color: theme.textSecondary }}>Available Times</span>
            {selectedPack !== "single" && (
              <span style={{ fontSize: 11, fontWeight: 700, color: remainingHours > 0 ? theme.success : theme.textSecondary, padding: "2px 8px", background: remainingHours > 0 ? theme.success + "18" : theme.surfaceAlt, borderRadius: 6 }}>
                {remainingHours} of {packHours} hrs remaining
              </span>
            )}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 6 }}>
            {timeSlots.map(slot => {
              const isSel = selectedSessions.includes(slot.id);
              const isFull = !isSel && selectedSessions.length >= packHours;
              const disabled = !slot.available || isFull;
              return (
                <button key={slot.id} onClick={() => !disabled && toggleSession(slot.id)}
                  style={{
                    padding: "10px 4px", borderRadius: 8, cursor: disabled ? "not-allowed" : "pointer",
                    background: isSel ? theme.primary : disabled ? theme.surfaceAlt : theme.cardBg,
                    border: `1.5px solid ${isSel ? theme.primary : disabled ? theme.border : theme.border}`,
                    opacity: disabled && !isSel ? 0.4 : 1,
                    textAlign: "center",
                  }}>
                  <div style={{ fontSize: 13, fontWeight: 700, color: isSel ? "#fff" : disabled ? theme.textSecondary : theme.text }}>{slot.time}</div>
                  {!slot.available && <div style={{ fontSize: 10, color: "#bbb", marginTop: 2 }}>Booked</div>}
                </button>
              );
            })}
          </div>
        </div>

        {/* Reviews (compact) */}
        <div style={{ marginBottom: 14 }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: theme.text, marginBottom: 8 }}>Reviews</div>
          {[
            { reviewer: "John D.", rating: 5, text: "Excellent coach! Really improved my forehand." },
            { reviewer: "Sarah M.", rating: 4, text: "Great analysis. Very knowledgeable about strategy." },
          ].map((review, i) => (
            <div key={i} style={{ background: theme.cardBg, border: `1px solid ${theme.border}`, borderRadius: 10, padding: 10, marginBottom: 6 }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 4 }}>
                <span style={{ fontSize: 12, fontWeight: 700, color: theme.text }}>{review.reviewer}</span>
                <span style={{ fontSize: 11, color: theme.warning, fontWeight: 700 }}>★ {review.rating}</span>
              </div>
              <div style={{ fontSize: 11, color: theme.textSecondary, lineHeight: 1.4 }}>{review.text}</div>
            </div>
          ))}
        </div>

        {/* Bottom Cart / CTA */}
        {selectedSessions.length > 0 && (
          <div style={{ background: theme.surfaceAlt, borderRadius: 14, padding: 14, marginBottom: 14 }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
              <div>
                <div style={{ fontSize: 14, fontWeight: 700, color: theme.text }}>{currentPack.name}</div>
                <div style={{ fontSize: 12, color: theme.textSecondary }}>{usedHours} session{usedHours > 1 ? "s" : ""} selected</div>
              </div>
              <div style={{ textAlign: "right" }}>
                <div style={{ fontSize: 20, fontWeight: 800, color: theme.primary }}>${totalPrice}.00</div>
                {selectedPack !== "single" && (
                  <div style={{ fontSize: 11, color: theme.success, fontWeight: 600 }}>{remainingHours} hr{remainingHours !== 1 ? "s" : ""} left in pack</div>
                )}
              </div>
            </div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 4, marginBottom: 10 }}>
              {selectedSessions.map(sId => {
                const slot = timeSlots.find(t => t.id === sId);
                const d = dates[selectedDate];
                return (
                  <div key={sId} style={{ display: "flex", alignItems: "center", gap: 4, padding: "4px 8px", background: theme.primaryLight, borderRadius: 6 }}>
                    <span style={{ fontSize: 11, fontWeight: 600, color: theme.primary }}>{d ? d.day : ""} {slot ? slot.time : ""}</span>
                    <button onClick={() => setSelectedSessions(prev => prev.filter(s => s !== sId))}
                      style={{ width: 16, height: 16, borderRadius: 8, background: theme.primary + "22", border: "none", cursor: "pointer", fontSize: 10, color: theme.primary, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center" }}>×</button>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* CTA */}
        <button onClick={() => selectedSessions.length > 0 && navigate("bookPayment", { from: "coachProfile", coachCount: selectedSessions.length })}
          style={{ width: "100%", padding: 14, background: selectedSessions.length > 0 ? theme.primary : theme.border, color: "#fff", border: "none", borderRadius: 12, fontSize: 15, fontWeight: 700, cursor: selectedSessions.length > 0 ? "pointer" : "default", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, opacity: selectedSessions.length > 0 ? 1 : 0.5 }} aria-label="Book Sessions">
          {Icons.calendar("#fff", 16)} {selectedSessions.length > 0 ? `Book ${usedHours} Session${usedHours > 1 ? "s" : ""} — $${totalPrice}.00` : "Select Sessions to Book"}
        </button>

        {/* Cross-sell: Book a Court */}
        {navContext.from !== "bookCourt" && (
        <div style={{ background: theme.surfaceAlt, border: `1px solid ${theme.border}`, borderRadius: 12, padding: 16, marginTop: 12, textAlign: "left" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
            <div style={{ width: 40, height: 40, borderRadius: 12, background: theme.success, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
              {Icons.calendar("#fff", 20)}
            </div>
            <div>
              <div style={{ fontSize: 14, fontWeight: 700, color: theme.text }}>Need a court too?</div>
              <div style={{ fontSize: 12, color: theme.textSecondary, marginTop: 2 }}>Reserve a court for your coaching session</div>
            </div>
          </div>
          <button onClick={() => navigate("bookVenue", { from: "coachProfile" })}
            style={{ width: "100%", padding: 12, background: theme.success, color: "#fff", border: "none", borderRadius: 8, fontSize: 14, fontWeight: 700, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
            {Icons.search("#fff", 16)} Book a Court
          </button>
        </div>
        )}
      </div>
    </div>
  );
}

// 12. CREATE LEAGUE SCREEN

                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 4 }}>

              </div>
              {/* Who's Going — avatar stack */}
              {cls.participants && cls.participants.length > 0 && (
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>

                        <div key={pi} style={{ marginLeft: pi > 0 ? -8 : 0, zIndex: 4 - pi }}>

      {/* Create Class CTA — for coaches/clubs */}
      <div style={{ marginTop: 8, padding: 16, background: theme.gradient, borderRadius: 14, textAlign: "center" }}>
        <div style={{ fontSize: 13, fontWeight: 700, color: "#fff", marginBottom: 4 }}>Are you a Coach or Club?</div>
        <div style={{ fontSize: 11, color: "rgba(255,255,255,0.7)", marginBottom: 12 }}>Create and manage your own group classes</div>

          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>

          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
