function CreateClassScreen({ theme, navigate }) {
  const [step, setStep] = useState(0);
  const [classType, setClassType] = useState(null);
  const [formData, setFormData] = useState({ name: "", level: "All Levels", day: "", time: "", duration: "60", maxSpots: "8", minEnroll: "3", price: "", venue: "", recurring: "Weekly", description: "" });

  if (step === 0) {
    return (
      <div style={{ padding: 16 }}>
        <h2 style={{ fontSize: 22, fontWeight: 700, color: theme.text, margin: "0 0 4px" }}>Create a Group Class</h2>
        <p style={{ fontSize: 13, color: theme.textSecondary, margin: "0 0 16px" }}>Choose a class type to get started</p>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
          {GROUP_CLASS_TYPES.map(t => (
            <button key={t.id} onClick={() => { setClassType(t.id); setStep(1); }}
              style={{ padding: 16, background: classType === t.id ? t.color + "18" : theme.cardBg, border: `2px solid ${classType === t.id ? t.color : theme.border}`, borderRadius: 14, cursor: "pointer", textAlign: "center" }}>
              <div style={{ width: 40, height: 40, borderRadius: 20, background: t.color + "18", margin: "0 auto 8px", display: "flex", alignItems: "center", justifyContent: "center" }}>
                {Icons[t.icon](t.color, 22)}
              </div>
              <div style={{ fontSize: 13, fontWeight: 700, color: theme.text }}>{t.label}</div>
            </button>
          ))}
        </div>
      </div>
    );
  }

  if (step === 1) {
    const ct = GROUP_CLASS_TYPES.find(t => t.id === classType);
    return (
      <div style={{ padding: 16 }}>
        <button onClick={() => setStep(0)} style={{ background: "none", border: "none", cursor: "pointer", marginBottom: 12, display: "flex", alignItems: "center", gap: 4 }}>
          {Icons.chevronLeft(theme.primary, 18)} <span style={{ fontSize: 13, color: theme.primary, fontWeight: 600 }}>Back</span>
        </button>

        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
          <div style={{ width: 36, height: 36, borderRadius: 18, background: ct.color + "18", display: "flex", alignItems: "center", justifyContent: "center" }}>
            {Icons[ct.icon](ct.color, 18)}
          </div>
          <div>
            <h2 style={{ fontSize: 20, fontWeight: 700, color: theme.text, margin: 0 }}>New {ct.label}</h2>
            <p style={{ fontSize: 12, color: theme.textSecondary, margin: 0 }}>Fill in the class details</p>
          </div>
        </div>

        {/* Form Fields */}
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {/* Class Name */}
          <div>
            <label style={{ fontSize: 12, fontWeight: 700, color: theme.text, marginBottom: 4, display: "block" }}>Class Name *</label>
            <input value={formData.name} onChange={e => setFormData({ ...formData, name: e.target.value })} placeholder={`e.g. Morning ${ct.label}`}
              style={{ width: "100%", padding: "12px 14px", border: `1px solid ${theme.border}`, borderRadius: 10, fontSize: 14, color: theme.text, background: theme.cardBg, outline: "none", boxSizing: "border-box" }} />
          </div>

          {/* Level */}
          <div>
            <label style={{ fontSize: 12, fontWeight: 700, color: theme.text, marginBottom: 4, display: "block" }}>Level</label>
            <div style={{ display: "flex", gap: 6 }}>
              {["Beginner", "Intermediate", "Advanced", "All Levels"].map(lvl => (
                <button key={lvl} onClick={() => setFormData({ ...formData, level: lvl })}
                  style={{ flex: 1, padding: "8px 4px", borderRadius: 8, border: `1.5px solid ${formData.level === lvl ? theme.primary : theme.border}`, background: formData.level === lvl ? theme.primaryLight : theme.cardBg, color: formData.level === lvl ? theme.primary : theme.textSecondary, fontSize: 11, fontWeight: 600, cursor: "pointer" }}>
                  {lvl}
                </button>
              ))}
            </div>
          </div>

          {/* Venue */}
          <div>
            <label style={{ fontSize: 12, fontWeight: 700, color: theme.text, marginBottom: 4, display: "block" }}>Venue *</label>
            <select value={formData.venue} onChange={e => setFormData({ ...formData, venue: e.target.value })}
              style={{ width: "100%", padding: "12px 14px", border: `1px solid ${theme.border}`, borderRadius: 10, fontSize: 14, color: theme.text, background: theme.cardBg, cursor: "pointer", boxSizing: "border-box" }}>
              <option value="">Select venue...</option>
              <option value="Roland Garros">Roland Garros</option>
              <option value="Wimbledon">Wimbledon</option>
              <option value="Melbourne Park">Melbourne Park</option>
              <option value="USTA Billie Jean King">USTA BJK</option>
              <option value="Indian Wells Tennis Garden">Indian Wells</option>
              <option value="Monte-Carlo Country Club">Monte-Carlo</option>
              <option value="Le Smash Tennis Club">Le Smash</option>
              <option value="Whoop Tennis Club">Whoop</option>
              <option value="Tennis Hugo">Tennis Hugo</option>
              <option value="CV Tennis Club">CV Tennis</option>
              <option value="Alpine Tennis Club">Alpine</option>
              <option value="Crystal G Tennis Club">Crystal G</option>
              <option value="Momo Tennis Academy">Momo Academy</option>
              <option value="Srichapan Academy">Srichapan Academy</option>
            </select>
          </div>

          {/* Schedule Row */}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
            <div>
              <label style={{ fontSize: 12, fontWeight: 700, color: theme.text, marginBottom: 4, display: "block" }}>Day(s) *</label>
              <input value={formData.day} onChange={e => setFormData({ ...formData, day: e.target.value })} placeholder="e.g. Mon, Wed"
                style={{ width: "100%", padding: "12px 14px", border: `1px solid ${theme.border}`, borderRadius: 10, fontSize: 13, color: theme.text, background: theme.cardBg, outline: "none", boxSizing: "border-box" }} />
            </div>
            <div>
              <label style={{ fontSize: 12, fontWeight: 700, color: theme.text, marginBottom: 4, display: "block" }}>Time *</label>
              <input value={formData.time} onChange={e => setFormData({ ...formData, time: e.target.value })} placeholder="e.g. 7:00 AM"
                style={{ width: "100%", padding: "12px 14px", border: `1px solid ${theme.border}`, borderRadius: 10, fontSize: 13, color: theme.text, background: theme.cardBg, outline: "none", boxSizing: "border-box" }} />
            </div>
          </div>

          {/* Duration + Recurring */}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
            <div>
              <label style={{ fontSize: 12, fontWeight: 700, color: theme.text, marginBottom: 4, display: "block" }}>Duration</label>
              <div style={{ display: "flex", gap: 4 }}>
                {["60", "90", "120"].map(d => (
                  <button key={d} onClick={() => setFormData({ ...formData, duration: d })}
                    style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: `1.5px solid ${formData.duration === d ? theme.primary : theme.border}`, background: formData.duration === d ? theme.primaryLight : theme.cardBg, color: formData.duration === d ? theme.primary : theme.textSecondary, fontSize: 12, fontWeight: 600, cursor: "pointer" }}>
                    {d}m
                  </button>
                ))}
              </div>
            </div>
            <div>
              <label style={{ fontSize: 12, fontWeight: 700, color: theme.text, marginBottom: 4, display: "block" }}>Frequency</label>
              <div style={{ display: "flex", gap: 4 }}>
                {["Weekly", "Bi-weekly", "One-time"].map(f => (
                  <button key={f} onClick={() => setFormData({ ...formData, recurring: f })}
                    style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: `1.5px solid ${formData.recurring === f ? theme.primary : theme.border}`, background: formData.recurring === f ? theme.primaryLight : theme.cardBg, color: formData.recurring === f ? theme.primary : theme.textSecondary, fontSize: 10, fontWeight: 600, cursor: "pointer" }}>
                    {f}
                  </button>
                ))}
              </div>
            </div>
          </div>

          {/* Class Size */}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10 }}>
            <div>
              <label style={{ fontSize: 12, fontWeight: 700, color: theme.text, marginBottom: 4, display: "block" }}>Max Spots</label>
              <input type="number" value={formData.maxSpots} onChange={e => setFormData({ ...formData, maxSpots: e.target.value })}
                style={{ width: "100%", padding: "12px 14px", border: `1px solid ${theme.border}`, borderRadius: 10, fontSize: 14, color: theme.text, background: theme.cardBg, outline: "none", boxSizing: "border-box", textAlign: "center" }} />
            </div>
            <div>
              <label style={{ fontSize: 12, fontWeight: 700, color: theme.text, marginBottom: 4, display: "block" }}>Min to Run</label>
              <input type="number" value={formData.minEnroll} onChange={e => setFormData({ ...formData, minEnroll: e.target.value })}
                style={{ width: "100%", padding: "12px 14px", border: `1px solid ${theme.border}`, borderRadius: 10, fontSize: 14, color: theme.text, background: theme.cardBg, outline: "none", boxSizing: "border-box", textAlign: "center" }} />
            </div>
            <div>
              <label style={{ fontSize: 12, fontWeight: 700, color: theme.text, marginBottom: 4, display: "block" }}>Price (THB)</label>
              <input type="number" value={formData.price} onChange={e => setFormData({ ...formData, price: e.target.value })} placeholder="350"
                style={{ width: "100%", padding: "12px 14px", border: `1px solid ${theme.border}`, borderRadius: 10, fontSize: 14, color: theme.text, background: theme.cardBg, outline: "none", boxSizing: "border-box", textAlign: "center" }} />
            </div>
          </div>

          {/* Description */}
          <div>
            <label style={{ fontSize: 12, fontWeight: 700, color: theme.text, marginBottom: 4, display: "block" }}>Description (optional)</label>
            <textarea value={formData.description} onChange={e => setFormData({ ...formData, description: e.target.value })} placeholder="Tell students what to expect..."
              rows={3} style={{ width: "100%", padding: "12px 14px", border: `1px solid ${theme.border}`, borderRadius: 10, fontSize: 13, color: theme.text, background: theme.cardBg, outline: "none", boxSizing: "border-box", resize: "none", fontFamily: "inherit" }} />
          </div>

          {/* Submit */}
          <button onClick={() => setStep(2)}
            style={{ width: "100%", padding: 16, background: theme.primary, color: "#fff", border: "none", borderRadius: 12, fontSize: 15, fontWeight: 700, cursor: "pointer", marginTop: 4, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
            Publish Class {Icons.chevronRight("#fff", 18)}
          </button>
        </div>
      </div>
    );
  }

  // Step 2: Confirmation
  const ct = GROUP_CLASS_TYPES.find(t => t.id === classType);
  return (
    <div style={{ padding: 20, textAlign: "center" }}>
      <div style={{ width: 72, height: 72, borderRadius: 36, background: ct.color + "18", margin: "40px auto 20px", display: "flex", alignItems: "center", justifyContent: "center" }}>
        {Icons.checkCircle(ct.color, 40)}
      </div>
      <h2 style={{ fontSize: 22, fontWeight: 800, color: theme.text, marginBottom: 8 }}>Class Published!</h2>
      <p style={{ fontSize: 14, color: theme.textSecondary, marginBottom: 8 }}>Your <strong>{ct.label}</strong> is now live and accepting enrollments.</p>
      <p style={{ fontSize: 12, color: theme.textSecondary, marginBottom: 24 }}>Students can find and book your class from the Browse Classes screen.</p>

      <div style={{ background: theme.surfaceAlt, borderRadius: 14, padding: 16, textAlign: "left", marginBottom: 24 }}>
        {[
          { icon: "users", label: "Group Class", value: formData.name || `New ${ct.label}` },
          { icon: "calendar", label: "Schedule", value: `${formData.day || "TBD"} at ${formData.time || "TBD"}` },
          { icon: "clock", label: "Duration", value: `${formData.duration} min` },
          { icon: "mapPin", label: "Venue", value: formData.venue || "TBD" },
          { icon: "dollar", label: "Price", value: formData.price ? `THB ${formData.price}/session` : "TBD" },
        ].map((item, i) => (
          <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: i < 4 ? 10 : 0 }}>
            {Icons[item.icon](theme.primary, 16)}
            <div>
              <div style={{ fontSize: 10, color: theme.textSecondary }}>{item.label}</div>
              <div style={{ fontSize: 13, fontWeight: 600, color: theme.text }}>{item.value}</div>
            </div>
          </div>
        ))}
      </div>

      <div style={{ display: "flex", gap: 10 }}>
        <button onClick={() => { setStep(0); setClassType(null); setFormData({ name: "", level: "All Levels", day: "", time: "", duration: "60", maxSpots: "8", minEnroll: "3", price: "", venue: "", recurring: "Weekly", description: "" }); }}
          style={{ flex: 1, padding: 14, background: theme.surfaceAlt, color: theme.primary, border: `1px solid ${theme.primary}`, borderRadius: 12, fontSize: 13, fontWeight: 700, cursor: "pointer" }}>
          Create Another
        </button>
        <button onClick={() => navigate("browseClass")}
          style={{ flex: 1, padding: 14, background: theme.primary, color: "#fff", border: "none", borderRadius: 12, fontSize: 13, fontWeight: 700, cursor: "pointer" }}>
          View Classes
        </button>
      </div>
    </div>
  );
}

// ────────────────────────────────────────────────────────────────────────
// 16. PRICING COMPARISON SCREEN — Free vs Premium vs Pro vs Club
// ────────────────────────────────────────────────────────────────────────
function PricingComparisonScreen({ theme, navigate }) {
  const [billing, setBilling] = useState("yearly");

  const plans = [
    { id: "free", name: "Free", monthlyPrice: "$0", yearlyPrice: "$0", color: theme.textSecondary, tagline: "For Newby", keyLine1: "Courts", keyLine2: "+ Matches", keyIcon: "calendar" },
    { id: "premium", name: "Premium", monthlyPrice: "$12/mo", yearlyPrice: "$108/yr", color: theme.primary, tagline: "Enthusiast & Solo Coach", save: "Save 25%", keyLine1: "0% Fee", keyLine2: "+ Classes", keyIcon: "activity" },
    { id: "pro", name: "Pro", monthlyPrice: "$49/mo", yearlyPrice: "$441/yr", color: "#F59E0B", tagline: "Event & Team Coach", save: "Save 25%", keyLine1: "Unlimited", keyLine2: "Events", keyIcon: "trophy" },
    { id: "club", name: "Club", monthlyPrice: "$299/mo", yearlyPrice: "$2,691/yr", color: "#E8344E", tagline: "For Court Owner · 0% Fee", save: "Save 25%", keyLine1: "Full CRM", keyLine2: "0% Fee", keyIcon: "building" },
  ];

  const features = [
    { label: "Court bookings", free: "Standard fees", premium: "0% commission", pro: "0% commission", club: "0% commission", highlight: "premium" },
    { label: "Progress tracking", free: "Basic", premium: "Full analytics", pro: "Full analytics", club: "Full analytics", highlight: "premium" },
    { label: "Cancellation alerts", free: "—", premium: "Instant", pro: "Instant", club: "Instant", highlight: "premium" },
    { label: "Event priority", free: "Standard", premium: "Priority", pro: "Priority", club: "Priority", highlight: "premium" },
    { label: "Join group classes", free: "Browse only", premium: "Unlimited", pro: "Unlimited", club: "Unlimited", highlight: "premium" },
    { label: "Create group classes", free: "—", premium: "2/month", pro: "Unlimited", club: "Unlimited", highlight: "premium" },
    { label: "Create tournaments", free: "≤12 players, 1/qtr", premium: "≤36 players, 1/mo", pro: "Unlimited", club: "Unlimited", highlight: "pro" },
    { label: "Create leagues", free: "—", premium: "10 players", pro: "Unlimited", club: "Unlimited", highlight: "pro" },
    { label: "Create events", free: "1/month", premium: "1/month", pro: "Unlimited", club: "Unlimited", highlight: "pro" },
    { label: "Tournament promotion", free: "12 players", premium: "Unlimited", pro: "Unlimited", club: "Unlimited", highlight: "premium" },
    { label: "Member CRM", free: "—", premium: "—", pro: "—", club: "Full CRM", highlight: "club" },
    { label: "Abandon rate tracking", free: "—", premium: "—", pro: "—", club: "Full dashboard", highlight: "club" },
    { label: "Revenue reports", free: "—", premium: "—", pro: "Basic", club: "Advanced", highlight: "club" },
  ];

  // Determine which plan column a highlight belongs to
  const highlightCol = { premium: 1, pro: 2, club: 3 };

  return (
    <div style={{ paddingBottom: 40 }}>
      {/* Hero */}
      <div style={{ background: theme.gradient, padding: "24px 20px 20px", textAlign: "center", color: "#fff" }}>
        <h2 style={{ fontSize: 22, fontWeight: 800, margin: "0 0 4px" }}>Choose Your Plan</h2>
        <p style={{ fontSize: 13, margin: 0, opacity: 0.8 }}>Compare all packages side by side</p>
      </div>

      <div style={{ padding: "16px 12px" }}>
        {/* Billing toggle */}
        <div style={{ display: "flex", background: theme.surfaceAlt, borderRadius: 10, padding: 3, marginBottom: 16 }}>
          {[{ id: "monthly", label: "Monthly" }, { id: "yearly", label: "Yearly", badge: "Best Value" }].map(b => (
            <button key={b.id} onClick={() => setBilling(b.id)}
              style={{ flex: 1, padding: "10px 4px", borderRadius: 8, border: "none", cursor: "pointer", textAlign: "center", background: billing === b.id ? theme.cardBg : "transparent", boxShadow: billing === b.id ? "0 1px 4px rgba(0,0,0,0.08)" : "none" }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: billing === b.id ? theme.primary : theme.textSecondary }}>{b.label}</div>
              {b.badge && billing === b.id && <div style={{ fontSize: 9, fontWeight: 700, color: theme.success, marginTop: 2 }}>{b.badge}</div>}
            </button>
          ))}
        </div>

        {/* Plan Cards — equal width grid with key differentiator */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 6, marginBottom: 16 }}>
          {plans.map(p => (
            <div key={p.id} style={{ padding: "12px 6px 10px", background: theme.cardBg, border: `2px solid ${p.color}`, borderRadius: 12, textAlign: "center", position: "relative", overflow: "hidden", display: "flex", flexDirection: "column" }}>
              {/* Colored top accent bar */}
              <div style={{ position: "absolute", top: 0, left: 0, right: 0, height: 3, background: p.color }} />
              {/* Icon — fixed height */}
              <div style={{ height: 36, display: "flex", alignItems: "center", justifyContent: "center" }}>
                <div style={{ width: 26, height: 26, borderRadius: 13, background: p.color + "18", display: "flex", alignItems: "center", justifyContent: "center" }}>
                  {Icons[p.keyIcon](p.color, 14)}
                </div>
              </div>
              {/* Name — fixed height */}
              <div style={{ height: 18, fontSize: 12, fontWeight: 800, color: theme.text, display: "flex", alignItems: "center", justifyContent: "center" }}>{p.name}</div>
              {/* Tagline — fixed height for 2 lines */}
              <div style={{ height: 28, fontSize: 9, color: theme.textSecondary, lineHeight: 1.2, display: "flex", alignItems: "center", justifyContent: "center" }}>{p.tagline}</div>
              {/* Price — fixed height */}
              <div style={{ height: 22, fontSize: 14, fontWeight: 800, color: p.color, display: "flex", alignItems: "center", justifyContent: "center" }}>{billing === "yearly" ? p.yearlyPrice : p.monthlyPrice}</div>
              {/* Save badge — fixed height */}
              <div style={{ height: 14, fontSize: 8, fontWeight: 700, color: theme.success, display: "flex", alignItems: "center", justifyContent: "center" }}>{p.save && billing === "yearly" ? p.save : "\u00A0"}</div>
              {/* Key differentiator badge — fixed height, pushed to bottom */}
              <div style={{ marginTop: "auto", padding: "5px 4px", background: p.color + "12", borderRadius: 6, border: `1px solid ${p.color}30`, height: 36, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
                <div style={{ fontSize: 8.5, fontWeight: 800, color: p.color, lineHeight: 1.2 }}>{p.keyLine1}</div>
                <div style={{ fontSize: 8, fontWeight: 600, color: p.color, lineHeight: 1.2, opacity: 0.8 }}>{p.keyLine2}</div>
              </div>
            </div>
          ))}
        </div>

        {/* Comparison Table with highlighted cells */}
        <div style={{ background: theme.surfaceAlt, borderRadius: 14, padding: 10, marginBottom: 16 }}>
          {/* Column Headers */}
          <div style={{ display: "grid", gridTemplateColumns: "1.4fr 1fr 1fr 1fr 1fr", gap: 4, padding: "8px 0", borderBottom: `2px solid ${theme.border}`, marginBottom: 4 }}>
            <span style={{ fontSize: 10, fontWeight: 700, color: theme.textSecondary }}>Feature</span>
            {plans.map(p => (
              <span key={p.id} style={{ fontSize: 10, fontWeight: 800, color: p.color, textAlign: "center" }}>{p.name}</span>
            ))}
          </div>
          {/* Rows — key differences highlighted with background tint */}
          {features.map((row, i) => {
            const hCol = highlightCol[row.highlight]; // which plan column to highlight (1=premium, 2=pro, 3=club)
            const hColor = row.highlight === "premium" ? theme.primary : row.highlight === "pro" ? "#F59E0B" : "#E8344E";
            const vals = [row.free, row.premium, row.pro, row.club];
            return (
              <div key={i} style={{ display: "grid", gridTemplateColumns: "1.4fr 1fr 1fr 1fr 1fr", gap: 4, padding: "7px 0", borderBottom: i < features.length - 1 ? `1px solid ${theme.border}` : "none", alignItems: "center" }}>
                <span style={{ fontSize: 10, fontWeight: 600, color: theme.text }}>{row.label}</span>
                {vals.map((val, ci) => {
                  const isEmpty = val === "—";
                  const isHighlighted = ci === hCol;
                  const colColor = ci === 0 ? theme.textSecondary : ci === 1 ? theme.primary : ci === 2 ? "#F59E0B" : "#E8344E";
                  return (
                    <span key={ci} style={{
                      fontSize: 9,
                      color: isEmpty ? theme.border : colColor,
                      fontWeight: isHighlighted ? 800 : 600,
                      textAlign: "center",
                      background: isHighlighted && !isEmpty ? hColor + "14" : "transparent",
                      borderRadius: isHighlighted ? 4 : 0,
                      padding: isHighlighted ? "3px 2px" : "0",
                      border: isHighlighted && !isEmpty ? `1px solid ${hColor}25` : "1px solid transparent",
                    }}>{val}</span>
                  );
                })}
              </div>
            );
          })}
        </div>

        {/* Key Differences Summary Cards */}
        <div style={{ marginBottom: 16 }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: theme.textSecondary, textTransform: "uppercase", letterSpacing: 0.8, marginBottom: 8 }}>What sets each plan apart</div>
          {[
            { plan: "Premium — Enthusiast & Solo Coach", color: theme.primary, icon: "star", diff: "0% commission, full analytics, book coaches, create up to 2 group classes/month, and priority event access." },
            { plan: "Pro — Event & Team Coach", color: "#F59E0B", icon: "trophy", diff: "Everything in Premium + unlimited tournaments, leagues, events, and group classes. Organizer assessment (OQS)." },
            { plan: "Club — Court Owner", color: "#E8344E", icon: "building", diff: "Everything in Pro + court management, member CRM, churn prediction, revenue reports. Club assessment (CQS)." },
          ].map((item, i) => (
            <div key={i} style={{ display: "flex", gap: 10, padding: "10px 12px", background: theme.cardBg, border: `1px solid ${item.color}30`, borderLeft: `3px solid ${item.color}`, borderRadius: 8, marginBottom: 6 }}>
              <div style={{ width: 28, height: 28, borderRadius: 14, background: item.color + "18", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, marginTop: 1 }}>
                {Icons[item.icon](item.color, 14)}
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 11, fontWeight: 800, color: item.color, marginBottom: 2 }}>{item.plan}</div>
                <div style={{ fontSize: 10, color: theme.textSecondary, lineHeight: 1.4 }}>{item.diff}</div>
              </div>
            </div>
          ))}
        </div>

        {/* CTA Buttons */}
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
          <button onClick={() => navigate("playerPremium")}
            style={{ padding: 14, background: theme.primary, color: "#fff", border: "none", borderRadius: 12, fontSize: 13, fontWeight: 700, cursor: "pointer" }}>
            Player & Coach Premium
          </button>
          <button onClick={() => navigate("clubPremium")}
            style={{ padding: 14, background: "#F59E0B", color: "#fff", border: "none", borderRadius: 12, fontSize: 13, fontWeight: 700, cursor: "pointer" }}>
            Club Premium
          </button>
        </div>
        <div style={{ textAlign: "center", fontSize: 11, color: theme.textSecondary, marginTop: 10 }}>Cancel anytime. No lock-in contracts.</div>
      </div>
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(TennisAce));
  </script>
</body>
